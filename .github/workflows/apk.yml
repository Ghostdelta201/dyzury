yaml
name: Zbuduj APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - name: Dodaj uprawnienia do alarmow i powiadomien
        run: |
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n<uses-permission android:name="android.permission.USE_EXACT_ALARM"/>\n<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n<uses-permission android:name="android.permission.VIBRATE"/>\n</manifest>#' android/app/src/main/AndroidManifest.xml
      - name: Wlasny dzwiek alarmu
        run: |
          if [ -f alarm.mp3 ]; then
            mkdir -p android/app/src/main/res/raw
            cp alarm.mp3 android/app/src/main/res/raw/alarm.mp3
            echo "window.NATIVE_SOUND='alarm.mp3';" > www/native-sound.js
          fi
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: dyzury-app
          path: android/app/build/outputs/apk/debug/app-debug.apk
